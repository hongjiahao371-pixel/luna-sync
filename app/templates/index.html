<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Luna Sync</title>
<style>
:root{color-scheme:light;--bg:#edf1f4;--panel:#ffffff;--ink:#172033;--muted:#667085;--line:#dce3ea;--line2:#edf1f5;--side:#202426;--side2:#292f33;--sideLine:#3a4248;--blue:#3267d6;--green:#259167;--amber:#b66b14;--red:#cf5147;--blue2:#e9f0ff;--green2:#e8f7ef;--amber2:#fff2d8;--red2:#fff0ee;--shadow:0 18px 50px rgba(31,44,67,.12)}
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0;overflow:hidden}
button,input,select{font:inherit}button{height:34px;border:1px solid transparent;border-radius:7px;background:var(--blue);color:white;padding:0 12px;cursor:pointer;white-space:nowrap;font-weight:700;box-shadow:0 1px 0 rgba(0,0,0,.06)}button:hover{filter:brightness(1.04)}button:disabled{opacity:.48;cursor:not-allowed;filter:none}.secondary{background:#eef3f8;color:#283548;border-color:#dbe4ee}.danger{background:var(--red)}.success{background:var(--green)}.ghost{background:#fff;border-color:var(--line);color:#263241}input,select{height:34px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:0 10px;outline:none}input:focus,select:focus{border-color:#8aaaf0;box-shadow:0 0 0 3px rgba(50,103,214,.12)}label{color:var(--muted)}
.appbar{position:sticky;top:0;z-index:5;background:rgba(32,36,38,.96);backdrop-filter:blur(16px);border-bottom:1px solid #3a4248}.appbar-inner{display:flex;align-items:center;gap:16px;padding:14px 20px}.brand{display:flex;align-items:center;gap:12px;min-width:220px;color:#fff}.logo{width:38px;height:38px;border-radius:8px;background:#35a876;color:#fff;display:grid;place-items:center;font-weight:900;box-shadow:inset 0 -12px 18px rgba(0,0,0,.18)}.brand h1{font-size:18px;margin:0;letter-spacing:.2px}.brand small{display:block;color:#b8c2ca;font-size:12px;margin-top:1px}.statusline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border:1px solid #465059;border-radius:999px;color:#d4dce2;background:#2a3034;font-size:12px}.pill.ok{color:#bdf4d7;border-color:#2f7651;background:#1d3d2d}.pill.warn{color:#ffe0a3;border-color:#77542a;background:#3a2d1f}.pill.bad{color:#ffc4bf;border-color:#85433f;background:#3b2423}.actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.appbar .ghost{background:#30373d;color:#f2f6f8;border-color:#48525a}
.main{display:grid;grid-template-columns:340px minmax(0,1fr);height:calc(100vh - 129px);min-height:0;padding:0}.panel{min-width:0;height:100%;overflow:hidden;background:var(--panel);border:0;border-right:1px solid var(--line);border-radius:0;box-shadow:none}aside.panel{background:var(--side);border-color:var(--sideLine);color:#eef4ff;display:flex;flex-direction:column;overflow:auto}aside.panel h2{color:#b8c4d6;border-color:var(--sideLine)}aside.panel .panel-body{border-color:var(--sideLine)}aside.panel .muted,aside.panel label{color:#9aa8bc}aside.panel input{background:#0f1726;border-color:#344158;color:#eef4ff}aside.panel .ghost,aside.panel .secondary{background:#202b3e;color:#eef4ff;border-color:#38465d}.panel h2{margin:0;padding:13px 15px;border-bottom:1px solid var(--line2);font-size:12px;text-transform:uppercase;color:#425167;letter-spacing:.07em}.panel-body{padding:14px 15px}.wifi-grid{display:grid;gap:11px}.wifi-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.wifi-row b{font-weight:800}.wifi-row input[type=password],.wifi-row input[type=text]{flex:1;min-width:0}.netlist{display:flex;gap:7px;flex-wrap:wrap;max-height:154px;overflow:auto}.net{border:1px solid #39475e;background:#202b3e;color:#eef4ff;border-radius:7px;padding:7px 9px;cursor:pointer}.net:hover{border-color:#5d7fc6;background:#26364f}.net.cam{border-color:#3f9e69;background:#183926;color:#c9f6dc}.metric{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--sideLine);border-radius:8px;overflow:hidden}.metric div{background:var(--side2);padding:13px;border-right:1px solid var(--sideLine);border-bottom:1px solid var(--sideLine)}.metric div:nth-child(2n){border-right:0}.metric div:nth-last-child(-n+2){border-bottom:0}.metric b{display:block;font-size:24px;line-height:1.05;color:#fff}.metric span{color:#9aa8bc;font-size:12px}.log{min-height:160px;flex:1;overflow:auto;background:#0b1220;border:1px solid var(--sideLine);border-radius:8px;padding:9px 10px;color:#b8f7cf;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
.library{display:flex;flex-direction:column;border-right:0}.library-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px 12px;border-bottom:1px solid var(--line2)}.library-head h2{padding:0;border:0;font-size:15px;text-transform:none;color:var(--ink);letter-spacing:0}.library-head small{display:block;margin-top:2px;color:var(--muted)}
.tabs{display:flex;gap:4px;padding:13px 18px 11px;border-bottom:1px solid var(--line2);background:#fff;align-items:center}.segcontrol{display:inline-flex;background:#eef2f7;border:1px solid var(--line2);border-radius:10px;padding:3px;gap:3px}.segcontrol .tab{appearance:none;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:13.5px;padding:8px 16px;cursor:pointer;border-radius:8px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;transition:background .15s,color .15s,box-shadow .15s}.segcontrol .tab:hover{color:var(--ink);background:rgba(50,103,214,.06)}.segcontrol .tab.active{color:#fff;background:var(--blue);box-shadow:0 2px 8px rgba(50,103,214,.28)}.segcontrol .tab svg{width:16px;height:16px;flex:none}.segcontrol .tab .cnt{display:inline-block;min-width:18px;padding:0 6px;height:18px;line-height:18px;border-radius:999px;background:#dde4ec;color:#5a6a7e;font-size:11px;text-align:center;font-weight:800}.segcontrol .tab.active .cnt{background:rgba(255,255,255,.28);color:#fff}
.locbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:11px 18px;border-bottom:1px solid var(--line2);background:#f8fafc;font-size:13px}.locbar .seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#fff}.locbar .seg button{height:30px;border:0;border-radius:0;background:#fff;color:var(--muted);font-weight:700;padding:0 11px;cursor:pointer}.locbar .seg button.on{background:var(--blue);color:#fff}.locbar .grow{flex:1}.locbar .stat{color:var(--muted)}
.wall{flex:1;min-height:0;overflow:auto;background:#fff;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));grid-auto-rows:135px;gap:12px;align-content:start}.card{position:relative;border-radius:9px;overflow:hidden;background:#eef3f8;border:1px solid var(--line2);height:135px;cursor:pointer}.card img,.card .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}.card .ph{display:grid;place-items:center;color:#8294a8;font-size:26px}.card .badge{position:absolute;top:7px;left:7px;height:21px;padding:0 8px;border-radius:999px;background:rgba(20,28,44,.78);color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;gap:4px;backdrop-filter:blur(4px)}.card .play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.card .play i{width:46px;height:46px;border-radius:999px;background:rgba(0,0,0,.5);display:grid;place-items:center;color:#fff;font-size:20px}.card .meta{position:absolute;left:0;right:0;bottom:0;padding:14px 9px 8px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.78));font-size:11px}.card .meta b{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}.card .meta span{color:#c5d2e4}.card:hover{box-shadow:0 10px 24px rgba(30,44,67,.16);transform:translateY(-1px)}.card .del{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:999px;border:0;background:rgba(20,28,44,.7);color:#fff;cursor:pointer;font-size:14px;display:none;place-items:center}.card:hover .del{display:grid}.card .del:hover{background:var(--red)}
.wall-empty{grid-column:1/-1;min-height:100%;display:grid;place-items:center;padding:58px 16px;text-align:center;color:var(--muted)}#viewCam{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line2);background:#fff}.tools .grow{flex:1;min-width:190px}.table-wrap{flex:1;min-height:0;overflow:auto;background:#fff}.file-table{width:100%;border-collapse:separate;border-spacing:0;min-width:940px}.file-table th,.file-table td{border-bottom:1px solid var(--line2);padding:11px;text-align:left;vertical-align:middle}.file-table th{position:sticky;top:0;z-index:1;background:#f6f8fb;color:#667085;font-size:12px;font-weight:800}.file-table tr:hover td{background:#f9fbfe}.thumb{width:64px;height:46px;border-radius:7px;background:#e7edf3;object-fit:cover;display:block;border:1px solid var(--line2)}.thumb-fallback{width:64px;height:46px;border-radius:7px;background:#eef3f8;border:1px solid var(--line2);display:grid;place-items:center;color:#728095;font-size:12px;text-transform:uppercase;font-weight:800}.name{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;max-width:430px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#182230}.muted{color:var(--muted)}.tag{display:inline-flex;align-items:center;height:24px;border-radius:999px;padding:0 8px;background:#edf2f7;color:#4b5a6d;font-size:12px;font-weight:700}.tag.done{background:var(--green2);color:var(--green)}aside.panel .tag{background:#343b42;color:#e1e9ee}aside.panel .tag.done{background:#1e4934;color:#c7f5d8}.empty{min-height:100%;display:grid;place-items:center;padding:58px 16px;text-align:center;color:var(--muted)}
.queue{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:10px 18px;z-index:6;box-shadow:0 -12px 30px rgba(27,39,57,.08)}.queue-grid{display:grid;grid-template-columns:minmax(180px,1fr) minmax(120px,280px);gap:14px;align-items:center}.bar{height:7px;background:#e3e9ef;border-radius:999px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green))}.queue small{color:var(--muted)}
.overlay{display:none;position:fixed;inset:0;background:rgba(9,14,22,.84);z-index:20;align-items:center;justify-content:center;padding:28px;flex-direction:column}.overlay.open{display:flex}.close{position:absolute;right:22px;top:18px;width:38px;height:38px;border-radius:999px;background:#fff;color:#172033;border-color:var(--line);font-size:22px}.viewer{max-width:94vw;max-height:84vh;display:grid;place-items:center}.viewer img,.viewer video{max-width:94vw;max-height:84vh;border-radius:8px;background:#05070a;box-shadow:0 20px 60px rgba(0,0,0,.35)}.viewer-note{margin-top:10px;color:#eef2f8;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center}.viewer-actions{margin-top:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
@media (max-width:900px){body{padding-bottom:128px;overflow:auto}.appbar-inner{align-items:flex-start;flex-direction:column;gap:10px;padding:12px}.brand{min-width:0}.statusline,.actions{width:100%;overflow:auto;padding-bottom:2px;scrollbar-width:none}.statusline::-webkit-scrollbar,.actions::-webkit-scrollbar{display:none}.statusline{flex-wrap:nowrap;gap:6px}.actions{margin-left:0;flex-wrap:nowrap;gap:6px}.actions button{height:32px;padding:0 8px;font-size:13px}.main{grid-template-columns:1fr;height:auto;min-height:auto}section.panel{order:1}aside.panel{order:2}.panel{height:auto;border-right:0;border-bottom:1px solid var(--line)}.queue-grid{grid-template-columns:1fr}.name{max-width:220px}.tools .grow{min-width:100%}}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-inner">
    <div class="brand"><div class="logo">L</div><div><h1>Luna Sync</h1><small id="subtitle">等待状态</small></div></div>
    <div class="statusline">
      <span id="cameraPill" class="pill">相机: 检查中</span>
      <span id="wifiPill" class="pill">Wi-Fi: -</span>
      <span id="autoPill" class="pill">自动同步: -</span>
    </div>
    <div class="actions">
      <button id="bScan" class="success">扫描相机文件</button>
      <button id="bAuto" class="ghost">自动同步</button>
      <button id="bDl">下载选中</button>
      <button id="bCan" class="danger">取消下载</button>
    </div>
  </div>
</header>
<main class="main">
  <aside class="panel">
    <h2>连接</h2>
    <div class="panel-body wifi-grid">
      <div class="wifi-row"><span class="muted">当前 Wi-Fi</span><b id="curwifi">-</b><span id="savedtag"></span></div>
      <div class="wifi-row"><span class="muted">连接后端</span><b id="backend">-</b><span id="controltag"></span></div>
      <div class="wifi-row"><button id="bWifi" class="secondary">扫描 Wi-Fi</button><button id="bForget" class="ghost">清除记住</button></div>
      <div id="wifilist" class="netlist"></div>
      <div class="wifi-row"><input id="ssid" type="text" placeholder="SSID"><input id="pw" type="password" placeholder="密码"></div>
      <div class="wifi-row"><label><input type="checkbox" id="rem" checked> 记住密码</label><button id="bConn" class="success">连接</button></div>
    </div>
    <h2>概览</h2>
    <div class="panel-body">
      <div class="metric">
        <div><b id="mFiles">0</b><span>文件</span></div>
        <div><b id="mSelected">0</b><span>已选</span></div>
        <div><b id="mQueue">0</b><span>队列</span></div>
        <div><b id="mDone">0</b><span>本次完成</span></div>
      </div>
    </div>
    <h2>日志</h2>
    <div class="panel-body"><div id="lg" class="log"></div></div>
  </aside>
  <section class="panel library">
    <div class="library-head"><div><h2>媒体库</h2><small id="libmeta">等待扫描</small></div><span class="tag">增量备份</span></div>
    <div class="tabs"><div class="segcontrol">
      <button class="tab active" id="tabCam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>相机文件<span class="cnt" id="camCnt">0</span></button>
      <button class="tab" id="tabLocal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>本地已下载<span class="cnt" id="localCnt">0</span></button>
    </div></div>
    <!-- Camera files view -->
    <div id="viewCam">
    <div class="tools">
      <button id="bAll" class="secondary">全选/反选</button>
      <button id="bMissing" class="secondary">选择未下载</button>
      <button id="bVisible" class="success">下载可见未下载</button>
      <label>类型 <select id="fl"><option value="">全部</option><option value="MP4">MP4</option><option value="LRV">LRV</option><option value="JPG">JPG</option><option value="JPEG">JPEG</option><option value="LIV">LIV</option><option value="INSP">INSP</option><option value="GIF">GIF</option></select></label>
      <label>状态 <select id="fs"><option value="">全部</option><option value="done">已下载</option><option value="ready">未下载</option></select></label>
      <input id="q" class="grow" type="text" placeholder="搜索文件名">
    </div>
    <div class="table-wrap">
      <table class="file-table">
        <thead><tr><th>预览</th><th><input type="checkbox" id="cAll"></th><th>文件名</th><th>类型</th><th>日期</th><th>大小</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="empty" class="empty">等待扫描相机文件</div>
    </div>
    </div><!-- /viewCam -->
    <!-- Local downloads view -->
    <div id="viewLocal" style="display:none;flex-direction:column;flex:1;min-height:0">
      <div class="locbar">
        <div class="seg">
          <button id="lfAll" class="on">全部</button>
          <button id="lfImg">照片</button>
          <button id="lfVid">视频</button>
        </div>
        <div class="seg">
          <button id="lvGrid" class="on" title="网格墙">▦</button>
          <button id="lvTable" title="表格">☰</button>
        </div>
        <input id="lq" class="grow" type="text" placeholder="搜索本地文件名">
        <span class="stat" id="lstat">-</span>
        <button id="bClearCache" class="ghost" title="清空缩略图和转码预览缓存（不影响已下载文件）">清除缓存</button>
      </div>
      <div id="wall" class="wall"></div>
      <div class="table-wrap" id="ltableWrap" style="display:none">
        <table class="file-table">
          <thead><tr><th>预览</th><th>文件名</th><th>类型</th><th>日期</th><th>大小</th><th>操作</th></tr></thead>
          <tbody id="ltbody"></tbody>
        </table>
        <div id="lempty" class="empty">本地还没有已下载的文件</div>
      </div>
    </div>
  </section>
</main>
<footer class="queue">
  <div class="queue-grid">
    <div><div id="cur">空闲</div><div class="bar"><i id="pf"></i></div></div>
    <div><small id="tot">本次完成 0</small><div class="bar"><i id="pt"></i></div></div>
  </div>
</footer>
<div id="ov" class="overlay">
  <button id="ovc" class="close" aria-label="关闭预览">x</button>
  <div id="ovc2" class="viewer"></div>
  <div id="ovn" class="viewer-note"></div>
  <div id="ova" class="viewer-actions"></div>
</div>
<script>
var FILES=[],LOCAL=[],SEL=new Set(),STATE={};
function $(i){return document.getElementById(i)}
function fmt(b){if(b===null||b===undefined)return '-';var u=['B','KB','MB','GB'];var i=0;while(b>=1024&&i<3){b/=1024;i++}return b.toFixed(b<10&&i?1:0)+' '+u[i]}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function isImg(k){return ['JPG','JPEG','PNG','WEBP','GIF','INSP','LIV'].indexOf(k)>=0}
function isGif(k){return k==='GIF'}
function isVid(k){return k==='MP4'||k==='LRV'||k==='MOV'}
function done(it){return (it.status||'').indexOf('完成')>=0}
var TAB='cam',LFIL='all',LMODE='grid';
function localFiles(){return LOCAL}
function localVisible(){var q=$('lq').value.trim().toLowerCase();return localFiles().filter(function(x){if(LFIL==='img'&&!isImg(x.kind))return false;if(LFIL==='vid'&&!isVid(x.kind))return false;if(q&&x.name.toLowerCase().indexOf(q)<0)return false;return true})}
function visible(){var f=$('fl').value,s=$('fs').value,q=$('q').value.trim().toLowerCase();return FILES.filter(function(x){if(f&&x.kind!==f)return false;if(s==='done'&&!done(x))return false;if(s==='ready'&&done(x))return false;if(q&&x.name.toLowerCase().indexOf(q)<0)return false;return true})}
function setPill(el, text, cls){el.className='pill '+(cls||'');el.textContent=text}
function updateMetrics(){var v=visible();$('mFiles').textContent=FILES.length;$('mSelected').textContent=SEL.size;$('mQueue').textContent=STATE.queue_len||0;$('mDone').textContent=STATE.completed||0;$('subtitle').textContent=v.length+' 个可见 · '+(STATE.last_auto_sync?('上次自动 '+STATE.last_auto_sync):'自动同步待命');$('libmeta').textContent=v.length+' 个可见 · '+SEL.size+' 个已选';
  var lf=localFiles(),ni=lf.filter(function(x){return isImg(x.kind)}).length,nv=lf.filter(function(x){return isVid(x.kind)}).length,tot=lf.reduce(function(a,x){return a+(x.bytes||0)},0);
  $('camCnt').textContent=FILES.length;$('localCnt').textContent=lf.length;$('lstat').textContent=lf.length+' 个 · 照片 '+ni+' / 视频 '+nv+' · '+fmt(tot)}
async function queueFiles(names){var d=await(await fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({files:names})})).json();alert(d.msg||('已加入下载队列 '+d.queued+' 个'));poll()}
function render(){
  var tb=$('tbody'),list=visible();tb.innerHTML='';$('empty').style.display=list.length?'none':'grid';
  list.forEach(function(it){
    var tr=document.createElement('tr');
    var prev=isImg(it.kind)?'<img class="thumb" src="/thumb/'+encodeURIComponent(it.name)+'" loading="lazy" alt="">':(isVid(it.kind)?'<div class="thumb-fallback">vid</div>':'<div class="thumb-fallback">file</div>');
    var actions='<button class="ghost act-preview">预览</button>'+(done(it)?' <button class="ghost act-delete">删除本地</button>':'');
    tr.innerHTML='<td>'+prev+'</td><td><input type="checkbox" '+(SEL.has(it.name)?'checked':'')+'></td><td><div class="name" title="'+esc(it.name)+'">'+esc(it.name)+'</div></td><td><span class="tag">'+esc(it.kind)+'</span></td><td class="muted">'+esc(((it.date||'')+' '+(it.time||'')).trim()||'-')+'</td><td>'+fmt(it.bytes)+'</td><td><span class="tag '+(done(it)?'done':'')+'">'+esc(it.status||'就绪')+'</span></td><td>'+actions+'</td>';
    tr.querySelector('input').onclick=function(e){e.stopPropagation()};tr.querySelector('input').onchange=function(){this.checked?SEL.add(it.name):SEL.delete(it.name);updateMetrics()};
    tr.querySelector('.act-preview').onclick=function(e){e.stopPropagation();openPrev(it)};
    var del=tr.querySelector('.act-delete');if(del)del.onclick=async function(e){e.stopPropagation();if(confirm('删除本地副本和预览缓存?')){await fetch('/api/file/'+encodeURIComponent(it.name),{method:'DELETE'});SEL.delete(it.name);scan()}};
    tr.onclick=function(){openPrev(it)};
    tb.appendChild(tr);
  });
  updateMetrics();
  renderLocal();
}
function renderLocal(){
  if(TAB!=='local')return;
  var list=localVisible();
  if(LMODE==='grid'){renderWall(list)}else{renderLocalTable(list)}
}
function renderWall(list){
  $('wall').style.display='grid';$('ltableWrap').style.display='none';
  var w=$('wall');w.innerHTML='';
  if(!list.length){w.innerHTML='<div class="wall-empty">'+(localFiles().length?'没有匹配的文件':'本地还没有已下载的文件<br><small>从「相机文件」勾选并下载，已完成的会出现在这里</small>')+'</div>';return}
  list.forEach(function(it){
    var c=document.createElement('div');c.className='card';
    var hasThumb=isImg(it.kind)||isVid(it.kind);
    var img=hasThumb?('<img src="/thumb/'+encodeURIComponent(it.name)+'" loading="lazy" alt="">'):('<div class="ph">'+(isVid(it.kind)?'▶':esc(it.kind))+'</div>');
    var badge='<span class="badge">'+(isVid(it.kind)?'视频':'照片')+'</span>';
    var play=isVid(it.kind)?'<div class="play"><i>▶</i></div>':'';
    var del='<button class="del" title="删除本地">✕</button>';
    c.innerHTML=img+badge+play+del+'<div class="meta"><b title="'+esc(it.name)+'">'+esc(it.name)+'</b><span>'+fmt(it.bytes)+' · '+esc(((it.date||'')+' '+(it.time||'')).trim()||'-')+'</span></div>';
    var im=c.querySelector('img');if(im){im.onerror=function(){var ph=document.createElement('div');ph.className='ph';ph.textContent=isVid(it.kind)?'▶':it.kind;im.replaceWith(ph)}}
    c.querySelector('.del').onclick=function(e){e.stopPropagation();delLocal(it.name)};
    c.onclick=function(){openPrev(it)};
    w.appendChild(c);
  });
}
function renderLocalTable(list){
  $('wall').style.display='none';$('ltableWrap').style.display='block';
  var tb=$('ltbody');tb.innerHTML='';$('lempty').style.display=list.length?'none':'grid';
  list.forEach(function(it){
    var tr=document.createElement('tr');
    var prev=isImg(it.kind)?'<img class="thumb" src="/thumb/'+encodeURIComponent(it.name)+'" loading="lazy" alt="">':(isVid(it.kind)?'<div class="thumb-fallback">vid</div>':'<div class="thumb-fallback">file</div>');
    tr.innerHTML='<td>'+prev+'</td><td><div class="name" title="'+esc(it.name)+'">'+esc(it.name)+'</div></td><td><span class="tag done">'+esc(it.kind)+'</span></td><td class="muted">'+esc(((it.date||'')+' '+(it.time||'')).trim()||'-')+'</td><td>'+fmt(it.bytes)+'</td><td><button class="ghost act-preview">预览</button> <button class="ghost act-delete">删除本地</button></td>';
    tr.querySelector('.act-preview').onclick=function(e){e.stopPropagation();openPrev(it)};
    tr.querySelector('.act-delete').onclick=function(e){e.stopPropagation();delLocal(it.name)};
    tr.onclick=function(){openPrev(it)};
    tb.appendChild(tr);
  });
}
async function delLocal(name){if(confirm('删除本地副本和预览缓存?')){await fetch('/api/file/'+encodeURIComponent(name),{method:'DELETE'});SEL.delete(name);scan()}}
function switchTab(t){TAB=t;$('tabCam').classList.toggle('active',t==='cam');$('tabLocal').classList.toggle('active',t==='local');$('viewCam').style.display=t==='cam'?'flex':'none';$('viewLocal').style.display=t==='local'?'flex':'none';renderLocal()}
async function scan(){
  $('bScan').disabled=true;$('bScan').textContent='扫描中';
  try{
    var rs=await Promise.all([fetch('/api/files'),fetch('/api/local-files')]);
    var d=await rs[0].json(), l=await rs[1].json();
    FILES=d.items;LOCAL=l.items||[];
    setPill($('cameraPill'),d.connected?'相机: 在线':'相机: 离线',d.connected?'ok':'bad');render()
  }
  catch(e){setPill($('cameraPill'),'相机: 错误','bad')}
  finally{$('bScan').disabled=false;$('bScan').textContent='扫描相机文件'}
}
function openPrev(it){
  $('ov').classList.add('open');$('ovn').textContent=it.name+' · '+fmt(it.bytes);$('ova').innerHTML='';var box=$('ovc2');
  if(isImg(it.kind)){box.innerHTML='<img src="/img/'+encodeURIComponent(it.name)+'" alt="">';return}
  if(isVid(it.kind)){box.innerHTML='<video src="/video/'+encodeURIComponent(it.name)+'" controls autoplay playsinline></video>';var b=document.createElement('button');b.textContent='生成兼容预览';b.onclick=function(){startTranscode(it.name)};$('ova').appendChild(b);box.querySelector('video').onerror=function(){startTranscode(it.name)};return}
  box.innerHTML='<div class="empty">此类型暂无预览</div>';
}
function startTranscode(name){
  $('ovc2').innerHTML='<div class="empty">正在生成兼容视频预览</div>';
  fetch('/api/transcode/'+encodeURIComponent(name),{method:'POST'});
  var iv=setInterval(async function(){try{var d=await(await fetch('/api/transcode/status/'+encodeURIComponent(name))).json();if(d.status==='done'){clearInterval(iv);$('ovc2').innerHTML='<video src="/play/'+encodeURIComponent(name)+'" controls autoplay playsinline></video>';$('ovn').textContent=name+' · 兼容预览已生成'}else if(d.status==='failed'){clearInterval(iv);$('ovc2').innerHTML='<div class="empty">转码失败: '+esc(d.msg||'未知错误')+'</div>'}else{$('ovn').textContent=name+' · '+({'downloading':'下载中','encoding':'转码中','pending':'排队'}[d.status]||'处理中')}}catch(e){}},1800)
}
function closePrev(){$('ov').classList.remove('open');$('ovc2').innerHTML='';$('ova').innerHTML=''}
async function scanWifi(){
  $('bWifi').disabled=true;$('bWifi').textContent='扫描中';
  try{var d=await(await fetch('/api/wifi/scan')).json();$('curwifi').textContent=d.current||'未连接';var html='';d.nets.forEach(function(n){html+='<span class="net '+(n.is_camera?'cam':'')+'" data-ssid="'+esc(n.ssid)+'">'+esc(n.ssid)+(n.signal?' '+esc(n.signal)+'%':'')+'</span>'});$('wifilist').innerHTML=html||'<span class="muted">没扫到网络</span>';document.querySelectorAll('.net').forEach(function(n){n.onclick=function(){$('ssid').value=this.getAttribute('data-ssid')}})}
  catch(e){$('wifilist').innerHTML='<span class="muted">扫描失败</span>'}
  finally{$('bWifi').disabled=false;$('bWifi').textContent='扫描 Wi-Fi'}
}
async function connWifi(){
  var ssid=$('ssid').value.trim();if(!ssid)return alert('请输入 SSID');$('bConn').disabled=true;$('bConn').textContent='连接中';
  try{await fetch('/api/wifi/connect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ssid:ssid,password:$('pw').value,remember:$('rem').checked})});setTimeout(scan,5000)}
  finally{$('bConn').disabled=false;$('bConn').textContent='连接'}
}
async function poll(){
  try{STATE=await(await fetch('/api/state')).json();$('curwifi').textContent=STATE.wifi_current||'未连接';$('backend').textContent=STATE.wifi_backend||'none';$('controltag').innerHTML=STATE.wifi_control?'<span class="tag done">可管理</span>':'<span class="tag">手动</span>';$('bWifi').disabled=!STATE.wifi_control;$('bConn').disabled=!STATE.wifi_control;$('savedtag').innerHTML=STATE.wifi_saved?'<span class="tag done">已记住</span>':'<span class="tag">未记住</span>';setPill($('wifiPill'),'Wi-Fi: '+(STATE.wifi_current||'未连接'),STATE.wifi_current?'ok':'warn');setPill($('autoPill'),'自动同步: '+(STATE.auto_sync?'开':'关'),STATE.auto_sync?'ok':'warn');$('bAuto').textContent=STATE.auto_sync?'关闭自动同步':'开启自动同步';if(STATE.connected)setPill($('cameraPill'),'相机: 在线','ok');if(STATE.wifi_conn&&!STATE.connected)setPill($('cameraPill'),'相机: 连接中','warn');if(STATE.current){var c=STATE.current,pc=c.total?Math.round(c.downloaded/c.total*100):0;$('cur').textContent='下载 '+c.name+' '+pc+'% ('+fmt(c.downloaded)+'/'+fmt(c.total)+', '+fmt(c.speed)+'/s)';$('pf').style.width=pc+'%'}else{$('cur').textContent=STATE.queue_len?('队列 '+STATE.queue_len+' 个'):'空闲';$('pf').style.width=0}$('tot').textContent='本次完成 '+STATE.completed;$('pt').style.width=FILES.length?Math.round((STATE.completed||0)/FILES.length*100)+'%':'0';$('lg').innerHTML=(STATE.log||[]).map(function(l){return '<div>'+esc(l)+'</div>'}).join('');updateMetrics()}
  catch(e){}
}
$('bScan').onclick=scan;$('bWifi').onclick=scanWifi;$('bConn').onclick=connWifi;$('bCan').onclick=function(){fetch('/api/cancel',{method:'POST'})};$('bForget').onclick=async function(){if(confirm('清除记住的 Wi-Fi 密码?')){await fetch('/api/wifi/forget',{method:'POST'});poll()}};$('bAuto').onclick=async function(){await fetch('/api/auto-sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:!STATE.auto_sync})});poll()};$('bDl').onclick=function(){if(!SEL.size)return alert('请先勾选文件');queueFiles(Array.from(SEL))};$('bVisible').onclick=function(){var ns=visible().filter(function(x){return !done(x)}).map(function(x){return x.name});if(!ns.length)return alert('当前可见文件都已下载');queueFiles(ns)};$('bMissing').onclick=function(){SEL.clear();visible().filter(function(x){return !done(x)}).forEach(function(x){SEL.add(x.name)});render()};$('bAll').onclick=function(){var v=visible(),all=!v.every(function(x){return SEL.has(x.name)});v.forEach(function(x){all?SEL.add(x.name):SEL.delete(x.name)});render()};$('cAll').onchange=$('bAll').onclick;$('fl').onchange=render;$('fs').onchange=render;$('q').oninput=render;$('ovc').onclick=closePrev;$('ov').onclick=function(e){if(e.target===$('ov'))closePrev()};
$('tabCam').onclick=function(){switchTab('cam')};$('tabLocal').onclick=function(){switchTab('local')};
function setLF(v){LFIL=v;['lfAll','lfImg','lfVid'].forEach(function(id){$(id).classList.toggle('on',id===('lf'+{all:'All',img:'Img',vid:'Vid'}[v]))});renderLocal()}
$('lfAll').onclick=function(){setLF('all')};$('lfImg').onclick=function(){setLF('img')};$('lfVid').onclick=function(){setLF('vid')};
$('lvGrid').onclick=function(){LMODE='grid';$('lvGrid').classList.add('on');$('lvTable').classList.remove('on');renderLocal()};
$('lvTable').onclick=function(){LMODE='table';$('lvTable').classList.add('on');$('lvGrid').classList.remove('on');renderLocal()};
$('lq').oninput=function(){renderLocal()};
$('bClearCache').onclick=async function(){
  if(!confirm('清空全部预览缓存（缩略图 + 转码预览）？\n已下载的文件不受影响，下次查看会重新生成。'))return;
  var btn=$('bClearCache');btn.disabled=true;btn.textContent='清理中…';
  try{var d=await(await fetch('/api/cache/clear',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({scope:'all'})})).json();
    alert(d.msg||('已清理 '+(d.files||0)+' 个文件'));scan()}
  catch(e){alert('清理失败，请重试')}
  finally{btn.disabled=false;btn.textContent='清除缓存'}
};
poll();scan();setInterval(poll,1500);
</script>
</body>
</html>
