<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Luna Sync</title>
<style>
:root{color-scheme:light;--bg:#edf1f4;--panel:#ffffff;--ink:#172033;--muted:#667085;--line:#dce3ea;--line2:#edf1f5;--side:#202426;--side2:#292f33;--sideLine:#3a4248;--blue:#3267d6;--green:#259167;--amber:#b66b14;--red:#cf5147;--blue2:#e9f0ff;--green2:#e8f7ef;--amber2:#fff2d8;--red2:#fff0ee;--shadow:0 18px 50px rgba(31,44,67,.12)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0;padding-bottom:104px}
button,input,select{font:inherit}button{height:34px;border:1px solid transparent;border-radius:7px;background:var(--blue);color:white;padding:0 12px;cursor:pointer;white-space:nowrap;font-weight:700;box-shadow:0 1px 0 rgba(0,0,0,.06)}button:hover{filter:brightness(1.04)}button:disabled{opacity:.48;cursor:not-allowed;filter:none}.secondary{background:#eef3f8;color:#283548;border-color:#dbe4ee}.danger{background:var(--red)}.success{background:var(--green)}.ghost{background:#fff;border-color:var(--line);color:#263241}input,select{height:34px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:0 10px;outline:none}input:focus,select:focus{border-color:#8aaaf0;box-shadow:0 0 0 3px rgba(50,103,214,.12)}label{color:var(--muted)}
.appbar{position:sticky;top:0;z-index:5;background:rgba(32,36,38,.96);backdrop-filter:blur(16px);border-bottom:1px solid #3a4248}.appbar-inner{display:flex;align-items:center;gap:16px;padding:14px 20px}.brand{display:flex;align-items:center;gap:12px;min-width:220px;color:#fff}.logo{width:38px;height:38px;border-radius:8px;background:#35a876;color:#fff;display:grid;place-items:center;font-weight:900;box-shadow:inset 0 -12px 18px rgba(0,0,0,.18)}.brand h1{font-size:18px;margin:0;letter-spacing:.2px}.brand small{display:block;color:#b8c2ca;font-size:12px;margin-top:1px}.statusline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border:1px solid #465059;border-radius:999px;color:#d4dce2;background:#2a3034;font-size:12px}.pill.ok{color:#bdf4d7;border-color:#2f7651;background:#1d3d2d}.pill.warn{color:#ffe0a3;border-color:#77542a;background:#3a2d1f}.pill.bad{color:#ffc4bf;border-color:#85433f;background:#3b2423}.actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.appbar .ghost{background:#30373d;color:#f2f6f8;border-color:#48525a}
.main{display:grid;grid-template-columns:326px minmax(0,1fr);gap:18px;padding:18px 20px 28px}.panel{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}aside.panel{background:var(--side);border-color:var(--sideLine);color:#eef4ff}aside.panel h2{color:#b8c4d6;border-color:var(--sideLine)}aside.panel .panel-body{border-color:var(--sideLine)}aside.panel .muted,aside.panel label{color:#9aa8bc}aside.panel input{background:#0f1726;border-color:#344158;color:#eef4ff}aside.panel .ghost,aside.panel .secondary{background:#202b3e;color:#eef4ff;border-color:#38465d}.panel h2{margin:0;padding:13px 15px;border-bottom:1px solid var(--line2);font-size:12px;text-transform:uppercase;color:#425167;letter-spacing:.07em}.panel-body{padding:14px 15px}.wifi-grid{display:grid;gap:11px}.wifi-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.wifi-row b{font-weight:800}.wifi-row input[type=password],.wifi-row input[type=text]{flex:1;min-width:0}.netlist{display:flex;gap:7px;flex-wrap:wrap;max-height:154px;overflow:auto}.net{border:1px solid #39475e;background:#202b3e;color:#eef4ff;border-radius:7px;padding:7px 9px;cursor:pointer}.net:hover{border-color:#5d7fc6;background:#26364f}.net.cam{border-color:#3f9e69;background:#183926;color:#c9f6dc}.metric{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--sideLine);border-radius:8px;overflow:hidden}.metric div{background:var(--side2);padding:13px;border-right:1px solid var(--sideLine);border-bottom:1px solid var(--sideLine)}.metric div:nth-child(2n){border-right:0}.metric div:nth-last-child(-n+2){border-bottom:0}.metric b{display:block;font-size:24px;line-height:1.05;color:#fff}.metric span{color:#9aa8bc;font-size:12px}.log{height:168px;overflow:auto;background:#0b1220;border:1px solid var(--sideLine);border-radius:8px;padding:9px 10px;color:#b8f7cf;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
.library-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px 12px;border-bottom:1px solid var(--line2)}.library-head h2{padding:0;border:0;font-size:15px;text-transform:none;color:var(--ink);letter-spacing:0}.library-head small{display:block;margin-top:2px;color:var(--muted)}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 15px;border-bottom:1px solid var(--line2);background:#fff}.tools .grow{flex:1;min-width:190px}.table-wrap{overflow:auto}.file-table{width:100%;border-collapse:separate;border-spacing:0;min-width:790px}.file-table th,.file-table td{border-bottom:1px solid var(--line2);padding:11px;text-align:left;vertical-align:middle}.file-table th{background:#f6f8fb;color:#667085;font-size:12px;font-weight:800}.file-table tr:hover td{background:#f9fbfe}.thumb{width:64px;height:46px;border-radius:7px;background:#e7edf3;object-fit:cover;display:block;border:1px solid var(--line2)}.thumb-fallback{width:64px;height:46px;border-radius:7px;background:#eef3f8;border:1px solid var(--line2);display:grid;place-items:center;color:#728095;font-size:12px;text-transform:uppercase;font-weight:800}.name{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;max-width:390px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#182230}.muted{color:var(--muted)}.tag{display:inline-flex;align-items:center;height:24px;border-radius:999px;padding:0 8px;background:#edf2f7;color:#4b5a6d;font-size:12px;font-weight:700}.tag.done{background:var(--green2);color:var(--green)}aside.panel .tag{background:#343b42;color:#e1e9ee}aside.panel .tag.done{background:#1e4934;color:#c7f5d8}.empty{min-height:260px;display:grid;place-items:center;padding:58px 16px;text-align:center;color:var(--muted)}
.queue{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:11px 20px;z-index:6;box-shadow:0 -12px 30px rgba(27,39,57,.08)}.queue-grid{display:grid;grid-template-columns:minmax(180px,1fr) minmax(120px,280px);gap:14px;align-items:center}.bar{height:7px;background:#e3e9ef;border-radius:999px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green))}.queue small{color:var(--muted)}
.overlay{display:none;position:fixed;inset:0;background:rgba(9,14,22,.84);z-index:20;align-items:center;justify-content:center;padding:28px;flex-direction:column}.overlay.open{display:flex}.close{position:absolute;right:22px;top:18px;width:38px;height:38px;border-radius:999px;background:#fff;color:#172033;border-color:var(--line);font-size:22px}.viewer{max-width:94vw;max-height:84vh;display:grid;place-items:center}.viewer img,.viewer video{max-width:94vw;max-height:84vh;border-radius:8px;background:#05070a;box-shadow:0 20px 60px rgba(0,0,0,.35)}.viewer-note{margin-top:10px;color:#eef2f8;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center}.viewer-actions{margin-top:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
@media (max-width:900px){body{padding-bottom:130px}.appbar-inner{align-items:flex-start;flex-direction:column;gap:10px;padding:12px}.brand{min-width:0}.statusline,.actions{width:100%;overflow:auto;padding-bottom:2px;scrollbar-width:none}.statusline::-webkit-scrollbar,.actions::-webkit-scrollbar{display:none}.statusline{flex-wrap:nowrap;gap:6px}.actions{margin-left:0;flex-wrap:nowrap;gap:6px}.actions button{height:32px;padding:0 8px;font-size:13px}.main{grid-template-columns:1fr;padding:12px}section.panel{order:1}aside.panel{order:2}.queue-grid{grid-template-columns:1fr}.name{max-width:220px}.tools .grow{min-width:100%}}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-inner">
    <div class="brand"><div class="logo">L</div><div><h1>Luna Sync</h1><small id="subtitle">等待状态</small></div></div>
    <div class="statusline">
      <span id="cameraPill" class="pill">相机: 检查中</span>
      <span id="wifiPill" class="pill">Wi-Fi: -</span>
      <span id="autoPill" class="pill">自动同步: -</span>
    </div>
    <div class="actions">
      <button id="bScan" class="success">扫描相机文件</button>
      <button id="bAuto" class="ghost">自动同步</button>
      <button id="bDl">下载选中</button>
      <button id="bCan" class="danger">取消下载</button>
    </div>
  </div>
</header>
<main class="main">
  <aside class="panel">
    <h2>连接</h2>
    <div class="panel-body wifi-grid">
      <div class="wifi-row"><span class="muted">当前 Wi-Fi</span><b id="curwifi">-</b><span id="savedtag"></span></div>
      <div class="wifi-row"><span class="muted">连接后端</span><b id="backend">-</b><span id="controltag"></span></div>
      <div class="wifi-row"><button id="bWifi" class="secondary">扫描 Wi-Fi</button><button id="bForget" class="ghost">清除记住</button></div>
      <div id="wifilist" class="netlist"></div>
      <div class="wifi-row"><input id="ssid" type="text" placeholder="SSID"><input id="pw" type="password" placeholder="密码"></div>
      <div class="wifi-row"><label><input type="checkbox" id="rem"> 记住密码</label><button id="bConn" class="success">连接</button></div>
    </div>
    <h2>概览</h2>
    <div class="panel-body">
      <div class="metric">
        <div><b id="mFiles">0</b><span>文件</span></div>
        <div><b id="mSelected">0</b><span>已选</span></div>
        <div><b id="mQueue">0</b><span>队列</span></div>
        <div><b id="mDone">0</b><span>本次完成</span></div>
      </div>
    </div>
    <h2>日志</h2>
    <div class="panel-body"><div id="lg" class="log"></div></div>
  </aside>
  <section class="panel">
    <div class="library-head"><div><h2>媒体库</h2><small id="libmeta">等待扫描</small></div><span class="tag">增量备份</span></div>
    <div class="tools">
      <button id="bAll" class="secondary">全选/反选</button>
      <label>类型 <select id="fl"><option value="">全部</option><option value="MP4">MP4</option><option value="LRV">LRV</option><option value="JPG">JPG</option><option value="JPEG">JPEG</option><option value="LIV">LIV</option><option value="INSP">INSP</option><option value="GIF">GIF</option></select></label>
      <label>状态 <select id="fs"><option value="">全部</option><option value="done">已下载</option><option value="ready">未下载</option></select></label>
      <input id="q" class="grow" type="text" placeholder="搜索文件名">
    </div>
    <div class="table-wrap">
      <table class="file-table">
        <thead><tr><th>预览</th><th><input type="checkbox" id="cAll"></th><th>文件名</th><th>类型</th><th>日期</th><th>大小</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="empty" class="empty">等待扫描相机文件</div>
    </div>
  </section>
</main>
<footer class="queue">
  <div class="queue-grid">
    <div><div id="cur">空闲</div><div class="bar"><i id="pf"></i></div></div>
    <div><small id="tot">本次完成 0</small><div class="bar"><i id="pt"></i></div></div>
  </div>
</footer>
<div id="ov" class="overlay">
  <button id="ovc" class="close" aria-label="关闭预览">x</button>
  <div id="ovc2" class="viewer"></div>
  <div id="ovn" class="viewer-note"></div>
  <div id="ova" class="viewer-actions"></div>
</div>
<script>
var FILES=[],SEL=new Set(),STATE={};
function $(i){return document.getElementById(i)}
function fmt(b){if(b===null||b===undefined)return '-';var u=['B','KB','MB','GB'];var i=0;while(b>=1024&&i<3){b/=1024;i++}return b.toFixed(b<10&&i?1:0)+' '+u[i]}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function isImg(k){return ['JPG','JPEG','PNG','WEBP','GIF','INSP','LIV'].indexOf(k)>=0}
function isGif(k){return k==='GIF'}
function isVid(k){return k==='MP4'||k==='LRV'||k==='MOV'}
function done(it){return (it.status||'').indexOf('完成')>=0}
function visible(){var f=$('fl').value,s=$('fs').value,q=$('q').value.trim().toLowerCase();return FILES.filter(function(x){if(f&&x.kind!==f)return false;if(s==='done'&&!done(x))return false;if(s==='ready'&&done(x))return false;if(q&&x.name.toLowerCase().indexOf(q)<0)return false;return true})}
function setPill(el, text, cls){el.className='pill '+(cls||'');el.textContent=text}
function updateMetrics(){var v=visible();$('mFiles').textContent=FILES.length;$('mSelected').textContent=SEL.size;$('mQueue').textContent=STATE.queue_len||0;$('mDone').textContent=STATE.completed||0;$('subtitle').textContent=v.length+' 个可见 · '+(STATE.last_auto_sync?('上次自动 '+STATE.last_auto_sync):'自动同步待命');$('libmeta').textContent=v.length+' 个可见 · '+SEL.size+' 个已选'}
function render(){
  var tb=$('tbody'),list=visible();tb.innerHTML='';$('empty').style.display=list.length?'none':'grid';
  list.forEach(function(it){
    var tr=document.createElement('tr');
    var prev=isImg(it.kind)?'<img class="thumb" src="/thumb/'+encodeURIComponent(it.name)+'" loading="lazy" alt="">':(isVid(it.kind)?'<div class="thumb-fallback">vid</div>':'<div class="thumb-fallback">file</div>');
    tr.innerHTML='<td>'+prev+'</td><td><input type="checkbox" '+(SEL.has(it.name)?'checked':'')+'></td><td><div class="name" title="'+esc(it.name)+'">'+esc(it.name)+'</div></td><td><span class="tag">'+esc(it.kind)+'</span></td><td class="muted">'+esc(((it.date||'')+' '+(it.time||'')).trim()||'-')+'</td><td>'+fmt(it.bytes)+'</td><td><span class="tag '+(done(it)?'done':'')+'">'+esc(it.status||'就绪')+'</span></td><td><button class="ghost">预览</button></td>';
    tr.querySelector('input').onclick=function(e){e.stopPropagation()};tr.querySelector('input').onchange=function(){this.checked?SEL.add(it.name):SEL.delete(it.name);updateMetrics()};
    tr.querySelector('button').onclick=function(e){e.stopPropagation();openPrev(it)};tr.onclick=function(){openPrev(it)};
    tb.appendChild(tr);
  });
  updateMetrics();
}
async function scan(){
  $('bScan').disabled=true;$('bScan').textContent='扫描中';
  try{var d=await(await fetch('/api/files')).json();FILES=d.items;setPill($('cameraPill'),d.connected?'相机: 在线':'相机: 离线',d.connected?'ok':'bad');render()}
  catch(e){setPill($('cameraPill'),'相机: 错误','bad')}
  finally{$('bScan').disabled=false;$('bScan').textContent='扫描相机文件'}
}
function openPrev(it){
  $('ov').classList.add('open');$('ovn').textContent=it.name+' · '+fmt(it.bytes);$('ova').innerHTML='';var box=$('ovc2');
  if(isImg(it.kind)){box.innerHTML='<img src="/img/'+encodeURIComponent(it.name)+'" alt="">';return}
  if(isVid(it.kind)){box.innerHTML='<video src="/video/'+encodeURIComponent(it.name)+'" controls autoplay playsinline></video>';var b=document.createElement('button');b.textContent='生成兼容预览';b.onclick=function(){startTranscode(it.name)};$('ova').appendChild(b);box.querySelector('video').onerror=function(){startTranscode(it.name)};return}
  box.innerHTML='<div class="empty">此类型暂无预览</div>';
}
function startTranscode(name){
  $('ovc2').innerHTML='<div class="empty">正在生成兼容视频预览</div>';
  fetch('/api/transcode/'+encodeURIComponent(name),{method:'POST'});
  var iv=setInterval(async function(){try{var d=await(await fetch('/api/transcode/status/'+encodeURIComponent(name))).json();if(d.status==='done'){clearInterval(iv);$('ovc2').innerHTML='<video src="/play/'+encodeURIComponent(name)+'" controls autoplay playsinline></video>';$('ovn').textContent=name+' · 兼容预览已生成'}else if(d.status==='failed'){clearInterval(iv);$('ovc2').innerHTML='<div class="empty">转码失败: '+esc(d.msg||'未知错误')+'</div>'}else{$('ovn').textContent=name+' · '+({'downloading':'下载中','encoding':'转码中','pending':'排队'}[d.status]||'处理中')}}catch(e){}},1800)
}
function closePrev(){$('ov').classList.remove('open');$('ovc2').innerHTML='';$('ova').innerHTML=''}
async function scanWifi(){
  $('bWifi').disabled=true;$('bWifi').textContent='扫描中';
  try{var d=await(await fetch('/api/wifi/scan')).json();$('curwifi').textContent=d.current||'未连接';var html='';d.nets.forEach(function(n){html+='<span class="net '+(n.is_camera?'cam':'')+'" data-ssid="'+esc(n.ssid)+'">'+esc(n.ssid)+(n.signal?' '+esc(n.signal)+'%':'')+'</span>'});$('wifilist').innerHTML=html||'<span class="muted">没扫到网络</span>';document.querySelectorAll('.net').forEach(function(n){n.onclick=function(){$('ssid').value=this.getAttribute('data-ssid')}})}
  catch(e){$('wifilist').innerHTML='<span class="muted">扫描失败</span>'}
  finally{$('bWifi').disabled=false;$('bWifi').textContent='扫描 Wi-Fi'}
}
async function connWifi(){
  var ssid=$('ssid').value.trim();if(!ssid)return alert('请输入 SSID');$('bConn').disabled=true;$('bConn').textContent='连接中';
  try{await fetch('/api/wifi/connect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ssid:ssid,password:$('pw').value,remember:$('rem').checked})});setTimeout(scan,5000)}
  finally{$('bConn').disabled=false;$('bConn').textContent='连接'}
}
async function poll(){
  try{STATE=await(await fetch('/api/state')).json();$('curwifi').textContent=STATE.wifi_current||'未连接';$('backend').textContent=STATE.wifi_backend||'none';$('controltag').innerHTML=STATE.wifi_control?'<span class="tag done">可管理</span>':'<span class="tag">手动</span>';$('bWifi').disabled=!STATE.wifi_control;$('bConn').disabled=!STATE.wifi_control;$('savedtag').innerHTML=STATE.wifi_saved?'<span class="tag done">已记住</span>':'';setPill($('wifiPill'),'Wi-Fi: '+(STATE.wifi_current||'未连接'),STATE.wifi_current?'ok':'warn');setPill($('autoPill'),'自动同步: '+(STATE.auto_sync?'开':'关'),STATE.auto_sync?'ok':'warn');$('bAuto').textContent=STATE.auto_sync?'关闭自动同步':'开启自动同步';if(STATE.connected)setPill($('cameraPill'),'相机: 在线','ok');if(STATE.wifi_conn&&!STATE.connected)setPill($('cameraPill'),'相机: 连接中','warn');if(STATE.current){var c=STATE.current,pc=c.total?Math.round(c.downloaded/c.total*100):0;$('cur').textContent='下载 '+c.name+' '+pc+'% ('+fmt(c.downloaded)+'/'+fmt(c.total)+', '+fmt(c.speed)+'/s)';$('pf').style.width=pc+'%'}else{$('cur').textContent=STATE.queue_len?('队列 '+STATE.queue_len+' 个'):'空闲';$('pf').style.width=0}$('tot').textContent='本次完成 '+STATE.completed;$('pt').style.width=FILES.length?Math.round((STATE.completed||0)/FILES.length*100)+'%':'0';$('lg').innerHTML=(STATE.log||[]).map(function(l){return '<div>'+esc(l)+'</div>'}).join('');updateMetrics()}
  catch(e){}
}
$('bScan').onclick=scan;$('bWifi').onclick=scanWifi;$('bConn').onclick=connWifi;$('bCan').onclick=function(){fetch('/api/cancel',{method:'POST'})};$('bForget').onclick=async function(){if(confirm('清除记住的 Wi-Fi 密码?')){await fetch('/api/wifi/forget',{method:'POST'});poll()}};$('bAuto').onclick=async function(){await fetch('/api/auto-sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:!STATE.auto_sync})});poll()};$('bDl').onclick=async function(){if(!SEL.size)return alert('请先勾选文件');var d=await(await fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({files:Array.from(SEL)})})).json();alert('已加入下载队列 '+d.queued+' 个')};$('bAll').onclick=function(){var v=visible(),all=!v.every(function(x){return SEL.has(x.name)});v.forEach(function(x){all?SEL.add(x.name):SEL.delete(x.name)});render()};$('cAll').onchange=$('bAll').onclick;$('fl').onchange=render;$('fs').onchange=render;$('q').oninput=render;$('ovc').onclick=closePrev;$('ov').onclick=function(e){if(e.target===$('ov'))closePrev()};
poll();scan();setInterval(poll,1500);
</script>
</body>
</html>
