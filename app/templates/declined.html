<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luna Sync</title>
<style>
:root{--ink:#1a2430;--text2:#3c4a5c;--muted:#64748b;--faint:#8a99a8;--line:#dde5ec;--accent:#263140;--danger:#c4443c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(900px 520px at 10% -6%,rgba(122,144,176,.18),transparent 60%),radial-gradient(820px 500px at 90% -8%,rgba(150,132,204,.11),transparent 60%),linear-gradient(180deg,#f7f9fa,#eef1f4);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}
.card{width:min(430px,92vw);background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.95);border-radius:16px;padding:30px 28px;box-shadow:0 24px 60px -20px rgba(31,44,67,.3),inset 0 1px 0 #fff}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;margin-bottom:18px}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(180deg,#33404e,#202a35);color:#fff;display:grid;place-items:center;font-weight:600;font-size:15px}
h1{font-size:18px;margin:0 0 8px;font-weight:600;letter-spacing:-.2px}
p{color:var(--text2);margin:0 0 10px;font-size:13.5px}
.links{margin:14px 0 0;font-size:13px}
.links a{color:var(--text2);font-weight:500}
.links a:hover{color:var(--ink)}
.actions{display:flex;gap:10px;margin-top:20px}
.actions a{flex:1;display:inline-flex;align-items:center;justify-content:center;height:40px;border-radius:8px;text-decoration:none;font-weight:500;font-size:13.5px}
.btn-primary{background:#263140;color:#fff;box-shadow:0 6px 16px -6px rgba(31,44,67,.45)}
.btn-primary:hover{background:#313e4e}
.btn-ghost{background:rgba(255,255,255,.7);color:var(--text2);border:1px solid var(--line)}
.btn-ghost:hover{background:var(--danger);border-color:var(--danger);color:#fff}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="logo">L</span>Luna Sync</div>
  <h1 id="title">您已选择不同意</h1>
  <p id="desc1">由于未获得您的同意，本应用已停止服务：Wi-Fi 扫描、相机访问、素材同步等所有功能均保持停用，应用不会处理上述信息。</p>
  <p id="desc2">您可以随时改变选择。点击「重新阅读协议」可再次查看并决定是否同意。</p>
  <p class="links"><a id="lnkPrivacy" href="/privacy" target="_blank" rel="noopener">隐私政策</a> · <a id="lnkTerms" href="/terms" target="_blank" rel="noopener">用户协议</a></p>
  <div class="actions">
    <a id="btnReconsider" class="btn-primary" href="/">重新阅读协议</a>
    <a id="btnExit" class="btn-ghost" href="/login">退出登录</a>
  </div>
</div>
<script>
var T={
  zh:{title:'您已选择不同意',desc1:'由于未获得您的同意，本应用已停止服务：Wi-Fi 扫描、相机访问、素材同步等所有功能均保持停用，应用不会处理上述信息。',desc2:'您可以随时改变选择。点击「重新阅读协议」可再次查看并决定是否同意。',privacy:'隐私政策',terms:'用户协议',reconsider:'重新阅读协议',exit:'退出登录',docTitle:'Luna Sync'},
  en:{title:'You have declined',desc1:'Without your consent this app stays disabled: Wi-Fi scanning, camera access, media sync, and all other features remain off, and none of the information above is processed.',desc2:'You can change your choice at any time. Use "Review again" to read the documents and decide whether to agree.',privacy:'Privacy Policy',terms:'User Agreement',reconsider:'Review again',exit:'Sign out',docTitle:'Luna Sync'}
};
var P=new URLSearchParams(location.search).get('lang');
var LANG=(P==='en'||P==='zh')?P:(localStorage.getItem('lunaLang')||(((navigator.language||'').toLowerCase().indexOf('zh')===0)?'zh':'en'));
if(P==='en'||P==='zh')localStorage.setItem('lunaLang',LANG);
function t(k){return (T[LANG]&&T[LANG][k])||T.zh[k]||k}
document.documentElement.lang=LANG==='zh'?'zh-CN':'en';
document.title=t('docTitle');
document.getElementById('title').textContent=t('title');
document.getElementById('desc1').textContent=t('desc1');
document.getElementById('desc2').textContent=t('desc2');
document.getElementById('lnkPrivacy').textContent=t('privacy');
document.getElementById('lnkTerms').textContent=t('terms');
document.getElementById('btnReconsider').textContent=t('reconsider');
document.getElementById('btnExit').textContent=t('exit');
</script>
</body>
</html>
