services:
  luna-sync:
    image: jvsheng/luna-sync:upk-v130-https-20260918
    restart: unless-stopped
    environment:
      - LUNA_CONFIG=/app/config.json
      - TZ=Asia/Shanghai
    expose:
      - "8766"
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /app/config.json <<'EOF'
        {
          "camera_host": "192.168.42.1",
          "camera_ssid": "",
          "camera_password": "",
          "camera_client_cidr": "192.168.42.2/24",
          "wifi_backend": "auto",
          "wifi_iface": null,
          "wpa_ctrl": "/run/wpa_supplicant",
          "auto_sync": true,
          "auto_sync_lrv": true,
          "auto_sync_interval_sec": 30,
          "download_dir": "/downloads",
          "state_dir": "/state",
          "web_port": 8766
        }
        EOF
        exec /entrypoint.sh
    volumes:
      - ${DOWNLOAD_DIR}:/downloads
      - ./state:/state

  luna-sync-open:
    image: jvsheng/luna-sync:upk-v130-https-20260918
    restart: unless-stopped
    depends_on:
      - luna-sync
    ports:
      - "8767:8767"
    environment:
      TZ: Asia/Shanghai
    entrypoint:
      - /bin/sh
      - -c
      - |
        python3 - <<'PY'
        import socket
        import socketserver
        import threading

        TARGET = ('luna-sync', 8766)

        class PassThrough(socketserver.BaseRequestHandler):
            def handle(self):
                try:
                    upstream = socket.create_connection(TARGET, timeout=15)
                except OSError:
                    try:
                        self.request.close()
                    except OSError:
                        pass
                    return

                def pipe(source, target):
                    try:
                        while True:
                            data = source.recv(65536)
                            if not data:
                                break
                            target.sendall(data)
                    except OSError:
                        pass
                    finally:
                        for sock in (source, target):
                            try:
                                sock.shutdown(socket.SHUT_RDWR)
                            except OSError:
                                pass

                workers = [
                    threading.Thread(target=pipe, args=(self.request, upstream), daemon=True),
                    threading.Thread(target=pipe, args=(upstream, self.request), daemon=True),
                ]
                for worker in workers:
                    worker.start()
                for worker in workers:
                    worker.join()

        class Server(socketserver.ThreadingTCPServer):
            allow_reuse_address = True
            daemon_threads = True

        Server(('0.0.0.0', 8767), PassThrough).serve_forever()
        PY
