services:
  luna-sync:
    image: jvsheng/luna-sync:upk-v130-https-20260918
    restart: unless-stopped
    environment:
      - LUNA_CONFIG=/app/config.json
      - LUNA_WIFI_GUIDANCE=ugos
      - TZ=Asia/Shanghai
    expose:
      - "8766"
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /app/config.json <<'EOF'
        {
          "camera_host": "192.168.42.1",
          "camera_ssid": "",
          "camera_password": "",
          "camera_client_cidr": "192.168.42.2/24",
          "wifi_backend": "auto",
          "wifi_iface": null,
          "wpa_ctrl": "/run/wpa_supplicant",
          "auto_sync": false,
          "auto_sync_lrv": true,
          "auto_sync_interval_sec": 30,
          "download_dir": "/downloads",
          "state_dir": "/state",
          "web_port": 8766
        }
        EOF
        exec /entrypoint.sh
    volumes:
      - ${DOWNLOAD_DIR}:/downloads
      - ./state:/state

  luna-sync-open:
    image: jvsheng/luna-sync:upk-v130-https-20260918
    restart: unless-stopped
    depends_on:
      - luna-sync
    ports:
      - "8767:8767"
    environment:
      TZ: Asia/Shanghai
    entrypoint:
      - /bin/sh
      - -c
      - |
        python3 - <<'PY'
        import socket
        import socketserver
        import threading

        TARGET = ('luna-sync', 8766)

        def pipe(source, target):
            try:
                while True:
                    data = source.recv(65536)
                    if not data:
                        break
                    target.sendall(data)
            except OSError:
                pass
            finally:
                for sock in (source, target):
                    try:
                        sock.shutdown(socket.SHUT_RDWR)
                    except OSError:
                        pass

        class Gateway(socketserver.BaseRequestHandler):
            def handle(self):
                request = self.request
                try:
                    request.settimeout(5)
                    lead = request.recv(1, socket.MSG_PEEK)
                    if not lead:
                        return
                    if lead == b'\x16':
                        # TLS ClientHello: pass the stream through untouched
                        # so the session stays end-to-end encrypted.
                        request.settimeout(None)
                        upstream = socket.create_connection(TARGET, timeout=15)
                        upstream.settimeout(None)
                        workers = [
                            threading.Thread(target=pipe, args=(request, upstream), daemon=True),
                            threading.Thread(target=pipe, args=(upstream, request), daemon=True),
                        ]
                        for worker in workers:
                            worker.start()
                        for worker in workers:
                            worker.join()
                        return
                    # Plaintext HTTP: carry no data, just point the client at
                    # the same port over HTTPS (UGOS opens the app as http://).
                    buffer = b''
                    while b'\r\n\r\n' not in buffer and len(buffer) < 8192:
                        try:
                            chunk = request.recv(4096)
                        except socket.timeout:
                            break
                        if not chunk:
                            break
                        buffer += chunk
                    host = ''
                    for line in buffer.split(b'\r\n')[1:]:
                        if line[:5].lower() == b'host:':
                            host = line[5:].strip().decode('latin-1')
                            break
                    if not host:
                        try:
                            host = request.getsockname()[0] or 'localhost'
                        except OSError:
                            host = 'localhost'
                    if ':' not in host:
                        host += ':8767'
                    response = (b'HTTP/1.1 301 Moved Permanently\r\n'
                                b'Location: https://' + host.encode('latin-1') + b'/\r\n'
                                b'Content-Length: 0\r\n'
                                b'Connection: close\r\n\r\n')
                    request.sendall(response)
                except OSError:
                    pass

        class Server(socketserver.ThreadingTCPServer):
            allow_reuse_address = True
            daemon_threads = True

        Server(('0.0.0.0', 8767), Gateway).serve_forever()
        PY
