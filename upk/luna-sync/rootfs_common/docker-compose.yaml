services:
  luna-sync:
    image: jvsheng/luna-sync:upk-v130-https-20260918
    restart: unless-stopped
    environment:
      - LUNA_CONFIG=/app/config.json
      - LUNA_WIFI_GUIDANCE=ugos
      - TZ=Asia/Shanghai
    expose:
      - "8766"
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /app/config.json <<'EOF'
        {
          "camera_host": "192.168.42.1",
          "camera_ssid": "",
          "camera_password": "",
          "camera_client_cidr": "192.168.42.2/24",
          "wifi_backend": "auto",
          "wifi_iface": null,
          "wpa_ctrl": "/run/wpa_supplicant",
          "auto_sync": false,
          "auto_sync_lrv": true,
          "auto_sync_interval_sec": 30,
          "download_dir": "/downloads",
          "state_dir": "/state",
          "web_port": 8766
        }
        EOF
        exec /entrypoint.sh
    volumes:
      - ${DOWNLOAD_DIR}:/downloads
      - ./state:/state

  luna-sync-open:
    image: jvsheng/luna-sync:upk-v130-https-20260918
    restart: unless-stopped
    depends_on:
      - luna-sync
    ports:
      - "8767:8767"
    environment:
      TZ: Asia/Shanghai
    entrypoint:
      - /bin/sh
      - -c
      - |
        python3 - <<'PY'
        import re
        import socket
        import ssl
        import socketserver
        import threading

        TARGET = ('luna-sync', 8766)
        TUNNEL_HOST_SUFFIX = 'ugapp.link'
        PROXY_HINT_HEADERS = (b'x-forwarded-for', b'x-forwarded-proto',
                              b'x-forwarded-host', b'via')
        IDLE_TIMEOUT = 75
        MAX_HEAD = 262144

        def pipe(source, target):
            try:
                while True:
                    data = source.recv(65536)
                    if not data:
                        break
                    target.sendall(data)
            except OSError:
                pass
            finally:
                for sock in (source, target):
                    try:
                        sock.shutdown(socket.SHUT_RDWR)
                    except OSError:
                        pass

        def respond(request, payload):
            try:
                request.sendall(payload)
            except OSError:
                pass

        def read_request_head(request):
            head = b''
            while b'\r\n\r\n' not in head:
                if len(head) >= MAX_HEAD:
                    return None
                try:
                    chunk = request.recv(16384)
                except (socket.timeout, OSError):
                    return None
                if not chunk:
                    return None
                head += chunk
            split = head.find(b'\r\n\r\n')
            return head[:split], head[split + 4:]

        def proxy_plain(request, head_part, body):
            """Relay one plain-HTTP request to the app over TLS. Returns True when
            the client connection may be reused for the next request."""
            try:
                context = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
                context.check_hostname = False
                context.verify_mode = ssl.CERT_NONE
                upstream = context.wrap_socket(socket.create_connection(TARGET, timeout=15))
            except OSError as err:
                print('gw: upstream connect failed: %r' % (err,), flush=True)
                respond(request, b'HTTP/1.1 502 Bad Gateway\r\nContent-Length: 0\r\n'
                                 b'Connection: close\r\n\r\n')
                return False
            try:
                upstream.settimeout(60)
                bare = re.sub(rb'(?i)\r\nconnection:[^\r\n]*', b'', head_part)
                upstream.sendall(bare + b'\r\nConnection: close\r\n\r\n' + body)
                length_match = re.search(rb'content-length:\s*(\d+)', bare.lower())
                needed = int(length_match.group(1)) if length_match else 0
                while len(body) < needed:
                    chunk = request.recv(65536)
                    if not chunk:
                        break
                    body += chunk
                    upstream.sendall(chunk)
                response = b''
                while b'\r\n\r\n' not in response:
                    chunk = upstream.recv(16384)
                    if not chunk:
                        return False
                    response += chunk
                    if len(response) > MAX_HEAD:
                        return False
                split = response.find(b'\r\n\r\n')
                resp_head, resp_body = response[:split], response[split + 4:]
                total_match = re.search(rb'(?i)\r\ncontent-length:\s*(\d+)',
                                        resp_head + b'\r\n')
                chunked = b'transfer-encoding:' in resp_head.lower() and \
                          b'chunked' in resp_head.lower()
                status = resp_head.split(b'\r\n', 1)[0]
                if chunked or not total_match:
                    # not length-framed: stream until upstream EOF, then close client
                    resp_head = re.sub(rb'(?i)\r\nconnection:[^\r\n]*', b'',
                                       resp_head) + b'\r\nConnection: close'
                    respond(request, resp_head + b'\r\n\r\n' + resp_body)
                    while True:
                        try:
                            chunk = upstream.recv(65536)
                        except (socket.timeout, OSError):
                            break
                        if not chunk:
                            break
                        respond(request, chunk)
                    return False
                total = int(total_match.group(1))
                while len(resp_body) < total:
                    chunk = upstream.recv(65536)
                    if not chunk:
                        return False
                    resp_body += chunk
                keep_head = re.sub(rb'(?i)\r\nconnection:[^\r\n]*', b'',
                                   resp_head) + b'\r\nConnection: keep-alive'
                respond(request, keep_head + b'\r\n\r\n' + resp_body)
                print('gw: %s -> %s' % (status.decode('latin-1', 'replace')[:60],
                                        'ok'), flush=True)
                return True
            except (OSError, socket.timeout) as err:
                print('gw: proxy error: %r' % (err,), flush=True)
                return False
            finally:
                try:
                    upstream.close()
                except OSError:
                    pass

        class Gateway(socketserver.BaseRequestHandler):
            def handle(self):
                request = self.request
                try:
                    request.settimeout(IDLE_TIMEOUT)
                    lead = request.recv(1, socket.MSG_PEEK)
                    if not lead:
                        return
                    if lead == b'\x16':
                        # TLS ClientHello: pass through untouched so the session
                        # stays end-to-end encrypted.
                        request.settimeout(None)
                        try:
                            upstream = socket.create_connection(TARGET, timeout=15)
                        except OSError:
                            request.close()
                            return
                        upstream.settimeout(None)
                        workers = [
                            threading.Thread(target=pipe, args=(request, upstream), daemon=True),
                            threading.Thread(target=pipe, args=(upstream, request), daemon=True),
                        ]
                        for worker in workers:
                            worker.start()
                        for worker in workers:
                            worker.join()
                        return
                    # Plain HTTP: serve requests on this connection until the peer
                    # closes or goes idle (relays pool and reuse connections).
                    while True:
                        parsed = read_request_head(request)
                        if parsed is None:
                            return
                        head_part, body = parsed
                        lines = head_part.split(b'\r\n')
                        parts = lines[0].split(b' ')
                        method = parts[0] if parts else b'GET'
                        path = parts[1] if len(parts) > 1 else b'/'
                        low = head_part.lower()
                        host = b''
                        for line in lines[1:]:
                            if line[:5].lower() == b'host:':
                                host = line[5:].strip()
                                break
                        host_s = host.decode('latin-1', 'replace')
                        via_tunnel = TUNNEL_HOST_SUFFIX in host_s.lower()
                        forwarded = any(h in low for h in PROXY_HINT_HEADERS)
                        if not (via_tunnel or forwarded or method not in (b'GET', b'HEAD')):
                            # direct LAN browser: point it at the HTTPS entry
                            if not host_s:
                                host_s = 'localhost:8767'
                            elif ':' not in host_s:
                                host_s += ':8767'
                            respond(request, b'HTTP/1.1 301 Moved Permanently\r\n'
                                             b'Location: https://' + host_s.encode('latin-1') + b'/\r\n'
                                             b'Content-Length: 0\r\nConnection: close\r\n\r\n')
                            return
                        print('gw: %s %s' % (method.decode('latin-1', 'replace'),
                                             path.decode('latin-1', 'replace')[:80]), flush=True)
                        if not proxy_plain(request, head_part, body):
                            return
                except OSError:
                    pass

        class Server(socketserver.ThreadingTCPServer):
            allow_reuse_address = True
            daemon_threads = True

        Server(('0.0.0.0', 8767), Gateway).serve_forever()

        PY
