spec_version: 2.1
app_id: com.jvsheng.lunasync
version: 1.1.0
support_arch:
  - amd64
  - arm64
is_docker_app: true
tag_types:
  - backup
  - media
depend_fw_version: 1.0.0
depend_docker_version: 20.10.0
allow_add_access_path: true
open_type: tab
port: 8767
privacy_policy_link:
  - https://github.com/hongjiahao371-pixel/luna-sync/blob/main/PRIVACY.md
license_agreement_link:
  - https://github.com/hongjiahao371-pixel/luna-sync/blob/main/TERMS.md
source_code_link:
  - https://github.com/hongjiahao371-pixel/luna-sync
technical_support_link:
  - https://github.com/hongjiahao371-pixel/luna-sync/issues
parameters:
  - key: DOWNLOAD_DIR
    type: path
    required: true
    changeable: true
    i18n:
      zh-CN:
        name: 素材保存目录
        description: 请选择专用于 Luna Sync 的独立目录。应用会在该目录写入和管理下载素材，请勿与个人文件或其他应用数据混存，以免卸载、清理或重新配置时发生误删。建议新建空目录，例如 /volume1/LunaSync
      en-US:
        name: Media save folder
        description: Choose a dedicated folder for Luna Sync. The app writes and manages downloaded media in this mounted directory. Do not mix personal files or other app data here, to avoid accidental deletion during cleanup, reconfiguration, or removal. Create an empty folder such as /volume1/LunaSync
i18n:
  zh-CN:
    name: Luna Sync
    description: Luna Sync 是一款面向 Luna Ultra 相机的本地素材备份与管理工具，可通过相机 Wi-Fi 扫描内置存储及存储卡中的照片、视频和 LRV 文件，并将新增素材增量同步到用户指定的 NAS 目录。应用支持断点续传、自动同步、LRV 筛选、本地媒体浏览、图片、动图与视频预览及兼容转码。所有凭据、缓存和素材均保存在用户自己的设备与局域网内，不提供云端上传服务。本应用与 Insta360（影石）不存在官方授权、合作或隶属关系。技术支持请访问 GitHub Issues
    author: jvsheng
    publisher: jvsheng
    publisher_link: https://github.com/hongjiahao371-pixel
    official: https://github.com/hongjiahao371-pixel
    help: https://github.com/hongjiahao371-pixel/luna-sync#readme
    release_note: |
      1. 新增 Live 动态图预览：点开先看静帧，可一键切换播放动态片段
      2. 新增 360 全景照片球面环视：按住拖动变换视角，滚轮缩放视野
      3. 相机文件列表支持表头排序（文件名/来源/类型/拍摄日期/大小），默认最新拍摄在前
      4. LRV 与视频文件在列表中直接显示缩略图
      5. Web 界面升级为加密访问（HTTPS），首次打开请按浏览器提示确认证书
      6. 首次使用提供「同意/不同意」的明确选择，应用内可随时查看隐私政策与用户协议
  en-US:
    name: Luna Sync
    description: Luna Sync is a local media backup and management tool for Luna Ultra cameras. It scans photos, videos, and LRV files from internal storage and memory cards over camera Wi-Fi, then incrementally syncs new media to a NAS folder selected by the user. It supports resumable downloads, automatic sync, LRV filtering, a local media library, image, animated image, and video previews, and compatible video transcoding. Credentials, cache, and media stay on the user's own device and local network, with no cloud upload service. Luna Sync is not affiliated with or endorsed by Insta360. Support is available through GitHub Issues
    author: jvsheng
    publisher: jvsheng
    publisher_link: https://github.com/hongjiahao371-pixel
    official: https://github.com/hongjiahao371-pixel
    help: https://github.com/hongjiahao371-pixel/luna-sync#readme
    release_note: |
      1. Live Photo preview: open the still and play the motion clip with one tap
      2. 360 panorama look-around with a perspective view; drag to rotate, scroll to zoom
      3. Sort the camera file list by name, source, type, date, or size; newest first by default
      4. LRV and video files now show thumbnails in the lists
      5. The web console now uses encrypted HTTPS access; confirm the certificate prompt on first visit
      6. First launch offers an explicit agree/decline choice, with the privacy policy and terms available in-app at any time
