spec_version: 2.1
app_id: com.jvsheng.lunasync
version: 1.0.0
support_arch:
  - amd64
is_docker_app: true
tag_types:
  - backup
  - media
depend_fw_version: 1.0.0
depend_docker_version: 20.10.0
allow_add_access_path: true
open_type: tab
port: 8767
parameters:
  - key: DOWNLOAD_DIR
    type: path
    required: true
    changeable: true
    i18n:
      zh-CN:
        name: 素材保存目录
        description: 选择 Luna Sync 自动备份素材的保存位置，建议使用 /volume1/LunaSync
      en-US:
        name: Media save folder
        description: Choose where Luna Sync stores downloaded media, for example /volume1/LunaSync

i18n:
  zh-CN:
    name: Luna Sync
    description: Luna Ultra 素材备份与同步工具
    author: jvsheng
  en-US:
    name: Luna Sync
    description: Luna Ultra media backup and sync tool
    author: jvsheng
