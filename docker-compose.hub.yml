# 自部署形态（Docker Hub 镜像）：host 网络 + 特权容器，应用可在 WebUI 内直接
# 接管宿主机无线网卡（wpa_supplicant / NetworkManager 模式）。绿联应用商店
# UPK 包受商店安全规范约束，使用桥接网络与非特权容器，两者互不影响。
services:
  luna-sync:
    image: jvsheng/luna-sync:latest
    container_name: luna-sync
    network_mode: host
    privileged: true
    restart: unless-stopped
    environment:
      - LUNA_CONFIG=/app/config.json
      - TZ=Asia/Shanghai
    volumes:
      - ./downloads:/downloads
      - ./state:/state
      - ./config.json:/app/config.json:ro
