services:
  luna-sync:
    image: jvsheng/luna-sync:latest
    container_name: luna-sync
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - LUNA_CONFIG=/app/config.json
      - TZ=Asia/Shanghai
    volumes:
      - ./downloads:/downloads
      - ./state:/state
      - ./config.json:/app/config.json:ro
